---
- name: Instalar paquetes de la base de datos
  ansible.builtin.apt:
    name: "{{ packages_database }}"
    state: present
    update_cache: yes
  notify: Reiniciar MySQL

# Escrivim al fitxer correcte (mysqld.cnf), no a my.cnf (ignorat per MySQL)
- name: Configurar bind-address per acceptar connexions remotes
  ansible.builtin.lineinfile:
    path: /etc/mysql/mysql.conf.d/mysqld.cnf
    regexp: '^bind-address'
    line: 'bind-address = 0.0.0.0'
  notify: Reiniciar MySQL

- name: Configurar mysqlx-bind-address
  ansible.builtin.lineinfile:
    path: /etc/mysql/mysql.conf.d/mysqld.cnf
    regexp: '^mysqlx-bind-address'
    line: 'mysqlx-bind-address = 0.0.0.0'
  notify: Reiniciar MySQL

- name: Assegurar que MySQL està en execució
  ansible.builtin.service:
    name: mysql
    state: started
    enabled: yes

# Flush handlers per assegurar que MySQL s'ha reiniciat abans de crear usuaris
- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Crear la base de dades de WordPress
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    login_user: root
    login_unix_socket: /var/run/mysqld/mysqld.sock

# host: "%" per permetre connexions des del webserver (192.168.11.40)
- name: Crear l'usuari de WordPress amb accés remot
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    priv: "{{ db_name }}.*:ALL"
    host: "%"
    state: present
    login_user: root
    login_unix_socket: /var/run/mysqld/mysqld.sock