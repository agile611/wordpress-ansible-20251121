---
- name: Instalar paquetes de la base de datos
  ansible.builtin.apt:
    name: "{{ packages_database }}"
    state: present
    update_cache: yes
  notify: Reiniciar MySQL

- name: Configurar bind-address per acceptar connexions remotes
  ansible.builtin.lineinfile:
    path: /etc/mysql/mysql.conf.d/mysqld.cnf
    regexp: '^bind-address'
    line: 'bind-address = 0.0.0.0'
  notify: Reiniciar MySQL

- name: Configurar mysqlx-bind-address
  ansible.builtin.lineinfile:
    path: /etc/mysql/mysql.conf.d/mysqld.cnf
    regexp: '^mysqlx-bind-address'
    line: 'mysqlx-bind-address = 0.0.0.0'
  notify: Reiniciar MySQL

- name: Assegurar que MySQL està en execució
  ansible.builtin.service:
    name: mysql
    state: started
    enabled: yes

- name: Flush handlers (reinicia MySQL abans de crear usuaris)
  ansible.builtin.meta: flush_handlers

# Crear /root/.my.cnf perquè el mòdul community.mysql
# pugui autenticar-se sense necessitat de login_unix_socket
- name: Crear /root/.my.cnf per autenticació automàtica de root
  ansible.builtin.copy:
    dest: /root/.my.cnf
    content: |
      [client]
      user=root
      socket=/var/run/mysqld/mysqld.sock
    owner: root
    group: root
    mode: '0600'

- name: Crear la base de dades de WordPress
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    login_user: root
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Crear l'usuari de WordPress amb accés remot
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    priv: "{{ db_name }}.*:ALL"
    host: "%"
    state: present
    login_user: root
    login_unix_socket: /var/run/mysqld/mysqld.sock