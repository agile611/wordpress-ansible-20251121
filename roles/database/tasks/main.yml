---
- name: Instalar paquetes de la base de datos
  ansible.builtin.apt:
    name: "{{ packages_database }}"
    state: present
    update_cache: yes
  notify: Reiniciar MySQL

# Fitxer correcte — mysqld.cnf (my.cnf és ignorat per MySQL)
- name: Configurar bind-address per acceptar connexions remotes
  ansible.builtin.lineinfile:
    path: /etc/mysql/mysql.conf.d/mysqld.cnf
    regexp: '^bind-address'
    line: 'bind-address = 0.0.0.0'
  notify: Reiniciar MySQL

- name: Configurar mysqlx-bind-address
  ansible.builtin.lineinfile:
    path: /etc/mysql/mysql.conf.d/mysqld.cnf
    regexp: '^mysqlx-bind-address'
    line: 'mysqlx-bind-address = 0.0.0.0'
  notify: Reiniciar MySQL

- name: Assegurar que MySQL està en execució
  ansible.builtin.service:
    name: mysql
    state: started
    enabled: yes

- name: Flush handlers (reinicia MySQL abans de crear usuaris)
  ansible.builtin.meta: flush_handlers

# Usar login_unix_socket en lloc de login_password
# En Ubuntu/Debian, root s'autentica via socket (auth_socket plugin)
# No necessita contrasenya si s'executa com a root del sistema
- name: Crear la base de dades de WordPress
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    login_user: root
    login_unix_socket: /var/run/mysqld/mysqld.sock

# Mateix fix — login_unix_socket per autenticar root
# host: "%" per permetre connexions des del webserver remot
- name: Crear l'usuari de WordPress amb accés remot
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    priv: "{{ db_name }}.*:ALL"
    host: "%"
    state: present
    login_user: root
    login_unix_socket: /var/run/mysqld/mysqld.sock

# Opcional però recomanat: establir contrasenya de root per a usos futurs
- name: Establir contrasenya de root MySQL
  community.mysql.mysql_user:
    name: root
    password: "{{ db_root_password }}"
    host_all: yes
    state: present
    login_user: root
    login_unix_socket: /var/run/mysqld/mysqld.sock
  when: db_root_password is defined and db_root_password != ""
